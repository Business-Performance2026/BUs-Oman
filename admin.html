<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>رحلاتك — لوحة الإدارة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>
<div id="phone">

  <!-- شاشة تحميل -->
  <section class="screen active" id="s-loading">
    <div class="wrap" style="padding-top:180px;text-align:center">
      <div class="logo" style="background:linear-gradient(140deg,#2a1a4a,#123a63)">🛡️</div>
      <div style="margin-top:16px"><span class="spin"></span></div>
    </div>
  </section>

  <!-- دخول الأدمن -->
  <section class="screen" id="s-login">
    <div class="appbar purple"><h1>🛡️ دخول الإدارة</h1></div>
    <div class="wrap">
      <div class="error" id="loginErr"></div>
      <div class="field"><label>البريد الإلكتروني</label><input id="aEmail" type="email" dir="ltr" style="text-align:right" placeholder="admin@mail.com"></div>
      <div class="field"><label>كلمة المرور</label><input id="aPass" type="password" placeholder="••••••••"></div>
      <button class="btn btn-primary" onclick="adminLogin()">دخول</button>
    </div>
  </section>

  <!-- الرئيسية: التحليلات -->
  <section class="screen" id="s-dash">
    <div class="appbar purple"><h1>لوحة تحكم الأدمن</h1><button class="side" onclick="logout()">خروج ⎋</button></div>
    <div class="wrap">
      <div class="stats">
        <div class="stat"><div class="ic" style="background:#ece6f8">🏢</div><b id="stCo">0</b><span>عدد الشركات</span></div>
        <div class="stat"><div class="ic" style="background:var(--teal-l)">🎫</div><b id="stBk">0</b><span>الحجوزات</span></div>
        <div class="stat"><div class="ic" style="background:#dff3e9">🚌</div><b id="stTr">0</b><span>إجمالي الرحلات</span></div>
        <div class="stat"><div class="ic" style="background:#f7ecd4">💰</div><b id="stRev">0</b><span>الإيرادات (ر.ع)</span></div>
      </div>
      <div class="stats" style="margin-top:12px">
        <div class="stat" style="cursor:pointer" onclick="showOnly('active')"><div class="ic" style="background:#dff3e9">✅</div><b id="stAct">0</b><span>مفعّلة</span></div>
        <div class="stat" style="cursor:pointer" onclick="showOnly('pending')"><div class="ic" style="background:#f7ecd4">⏳</div><b id="stPd">0</b><span>بانتظار التفعيل</span></div>
      </div>
      <h2 class="sec">طلبات التفعيل <small onclick="loadAdmin()">↻ تحديث</small></h2>
      <div id="pendingList"></div>
    </div>
    <nav class="bnav">
      <button class="on" onclick="loadAdmin()"><span class="i">📊</span>الرئيسية</button>
      <button onclick="openCompanies()"><span class="i">🏢</span>الشركات</button>
    </nav>
  </section>

  <!-- صفحة الشركات -->
  <section class="screen" id="s-companies">
    <div class="appbar purple"><h1>الشركات</h1><button class="side" onclick="loadAdmin()">↻ تحديث</button></div>
    <div class="wrap">
      <div class="chips" id="statusChips">
        <button class="chip on" data-s="">الكل</button>
        <button class="chip" data-s="active">✅ المفعّلة</button>
        <button class="chip" data-s="pending">⏳ المعلّقة</button>
        <button class="chip" data-s="suspended">⛔ الموقوفة</button>
      </div>
      <div id="companiesList"></div>
    </div>
    <nav class="bnav">
      <button onclick="loadAdmin()"><span class="i">📊</span>الرئيسية</button>
      <button class="on"><span class="i">🏢</span>الشركات</button>
    </nav>
  </section>

  <!-- تفاصيل شركة -->
  <section class="screen" id="s-co">
    <div class="appbar purple"><button class="back" onclick="goBack()">→</button><h1>تفاصيل الشركة</h1></div>
    <div class="wrap" id="coDetail"></div>
  </section>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="js/firebase-config.js?v=4"></script>
<script src="js/common.js?v=4"></script>
<script src="js/admin.js?v=4"></script>
</body>
</html>
