<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>رحلاتك — حجز رحلة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=14">
</head>
<body>
<div id="phone">

  <!-- الرئيسية: رحلات الشركة -->
  <section class="screen active" id="s-home">
    <div class="appbar" style="padding-bottom:26px">
      <div style="display:flex;align-items:center;gap:12px">
        <div id="coLogoC" style="width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.18);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0">🚌</div>
        <div style="flex:1;min-width:0">
          <h1 id="coName" style="text-align:right">...</h1>
          <p id="coCr" style="font-size:12px;opacity:.85;text-align:right"></p>
          <p id="coSub" style="font-size:12.5px;opacity:.8;margin-top:2px;text-align:right"></p>
        </div>
      </div>
      <button class="side" onclick="show('s-find')">حجوزاتي 🎫</button>
    </div>
    <div class="wrap">
      <div class="banner"><h3>رحلات مريحة وآمنة</h3><p>احجز مقعدك الآن بثوانٍ</p></div>
      <div class="chips" id="contactChips" style="margin-bottom:14px"></div>
      <div class="chips" id="typeChips">
        <button class="chip on" data-t="">الكل</button>
        <button class="chip" data-t="جامعات وكليات">الجامعات والكليات</button>
        <button class="chip" data-t="حج وعمرة">حج وعمرة</button>
        <button class="chip" data-t="رحلة يومية">رحلات يومية</button>
      </div>
      <h2 class="sec">الرحلات المتاحة</h2>
      <div id="tripsList"><div class="empty"><span class="spin"></span> جارِ تحميل الرحلات...</div></div>
    </div>
  </section>

  <!-- تفاصيل الرحلة -->
  <section class="screen" id="s-trip">
    <div class="appbar"><button class="back" onclick="goBack()">→</button><h1>تفاصيل الرحلة</h1></div>
    <div class="wrap" id="tripDetail"></div>
  </section>

  <!-- نموذج الحجز -->
  <section class="screen" id="s-book">
    <div class="appbar"><button class="back" onclick="goBack()">→</button><h1>إتمام الحجز</h1></div>
    <div class="wrap">
      <div class="card">
        <h3 style="font-weight:900;margin-bottom:14px">بيانات المسافر</h3>
        <div class="error" id="bookErr"></div>
        <div class="field"><label>الاسم الكامل *</label><input id="bName" placeholder="اسم المسافر"></div>
        <div class="field"><label>رقم الواتساب * <span class="muted">(تصلك عليه التذكرة)</span></label><input id="bWa" inputmode="tel" placeholder="9xxxxxxx" dir="ltr" style="text-align:right"></div>
        <div class="field" id="bStopWrap" style="display:none"><label>🚏 محطة الصعود</label>
          <select id="bStop"></select>
        </div>
        <div class="field"><label>عدد المقاعد</label>
          <select id="bSeats"><option>1</option><option>2</option><option>3</option><option>4</option></select>
        </div>
      </div>
      <button class="btn btn-primary" id="bookBtn" onclick="submitBooking()">متابعة الحجز</button>
    </div>
  </section>

  <!-- طريقة الدفع -->
  <section class="screen" id="s-pay">
    <div class="appbar"><h1>طريقة الدفع</h1></div>
    <div class="wrap" id="payBox"></div>
  </section>

  <!-- التحقق من التذكرة (مسح الباركود) -->
  <section class="screen" id="s-verify">
    <div class="appbar"><h1>التحقق من التذكرة</h1></div>
    <div class="wrap" id="verifyBox"></div>
  </section>

  <!-- التذكرة -->
  <section class="screen" id="s-ticket">
    <div class="appbar"><h1>تذكرة الرحلة</h1></div>
    <div class="wrap" id="ticketBox"></div>
  </section>

  <!-- حجوزاتي -->
  <section class="screen" id="s-find">
    <div class="appbar"><button class="back" onclick="goBack()">→</button><h1>حجوزاتي</h1></div>
    <div class="wrap">
      <div class="card">
        <p class="muted" style="margin-bottom:12px">أدخل رقم الواتساب الذي حجزت به لعرض تذاكرك</p>
        <div class="field"><input id="findWa" inputmode="tel" placeholder="05xxxxxxxx" dir="ltr" style="text-align:right"></div>
        <button class="btn btn-teal" onclick="findBookings()">عرض حجوزاتي</button>
      </div>
      <div id="myBookings"></div>
    </div>
  </section>

  <!-- خطأ / شركة غير متاحة -->
  <section class="screen" id="s-404">
    <div class="wrap" style="padding-top:120px">
      <div class="empty">😕<br><br><span id="errMsg">الرابط غير صحيح أو الشركة غير متاحة حاليًا</span></div>
    </div>
  </section>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="js/firebase-config.js?v=14"></script>
<script src="js/common.js?v=14"></script>
<script src="js/customer.js?v=14"></script>
</body>
</html>
